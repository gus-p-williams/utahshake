site_name: UHSN Student Seismology
site_description: Apps and docs for the Utah High School Seismic Network
site_url: https://gus-p-williams.github.io/utahshake/
repo_url: https://github.com/gus-p-williams/utahshake
repo_name: gus-p-williams/utahshake
edit_uri: edit/main/docs/
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
  palette:
    - scheme: default
      toggle: {icon: material/brightness-7, name: Dark mode}
    - scheme: slate
      toggle: {icon: material/brightness-4, name: Light mode}
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.arithmatex: {generic: true}
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js
nav:
  - Home: index.md
  - Apps:
      - Open the apps: app/index.html
      - Wave Race guide: apps/wave-race.md
  - Theory:
      - Seismic waves: theory/waves.md
      - Distance from S minus P: theory/s-minus-p.md
      - Locating a quake: theory/locating.md
  - Teachers:
      - "Activity card: Wave Race": teachers/wave-race-card.md
      - Standards crosswalk: teachers/standards.md
  - Developers:
      - Architecture: developers/architecture.md
      - Data sources and licensing: developers/data-sources.md
