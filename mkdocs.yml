site_name: UHSN Student Seismology
site_description: Apps and docs for the Utah High School Seismic Network
site_url: https://gus-p-williams.github.io/utahshake/
repo_url: https://github.com/gus-p-williams/utahshake
repo_name: gus-p-williams/utahshake
edit_uri: edit/main/docs/
theme:
  name: material
  # No navigation.tabs: the whole site map stays visible in one sidebar (decision D17).
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.path
    - navigation.footer
    - navigation.tracking
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      toggle: {icon: material/brightness-7, name: Dark mode}
    - scheme: slate
      toggle: {icon: material/brightness-4, name: Light mode}
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.arithmatex: {generic: true}
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js
validation:
  nav:
    omitted_files: warn  # with --strict in CI, a page missing from nav fails the build
  links:
    anchors: warn        # with --strict in CI, a broken #anchor link fails the build
# One hub page per app (apps/<app>.md); The Science, Teachers and Developers are shared
# sections that the hubs link into. Each section opens on its own index.md.
nav:
  - Home: index.md
  - Apps:
      - apps/index.md
      - Wave Race: apps/wave-race.md
      - Quake Waves: apps/quake-waves.md
  - The Science:
      - theory/index.md
      - Seismic waves: theory/waves.md
      - Reading a seismogram: theory/seismograms.md
      - Distance from S minus P: theory/s-minus-p.md
      - Locating a quake: theory/locating.md
      - Our stations and data: theory/stations.md
  - Teachers:
      - teachers/index.md
      - Wave Race activity card: teachers/wave-race-card.md
      - Standards crosswalk: teachers/standards.md
  - Developers:
      - developers/index.md
      - Architecture: developers/architecture.md
      - Data sources and licensing: developers/data-sources.md
      - Adding an app: developers/adding-an-app.md
      - App notes:
          - Wave Race: developers/wave-race.md
