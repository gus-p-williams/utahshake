<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<title>One station, one quake: TMU and the Kenilworth quake</title>
<desc>Map: from station TMU a line points toward the direction found from P-wave motion; a circle at the distance from S minus P crosses it at the estimate, near the true epicenter.</desc>
<rect x="0.5" y="0.5" width="759" height="439" rx="8" fill="#ffffff" stroke="#d9dde3"/>
<text x="12" y="22" font-size="15" font-weight="600" fill="#111827">One station, one quake: TMU and the Kenilworth quake</text>
<defs><clipPath id="gm-map"><rect x="14" y="34" width="456" height="392" rx="4"/></clipPath></defs>
<rect x="14" y="34" width="456" height="392" rx="4" fill="#f3efe4" stroke="#d9dde3"/>
<g clip-path="url(#gm-map)">
<polygon points="151.5,321 399.9,-118.2 586.6,65.8" fill="rgba(124,58,237,0.10)"/>
<circle cx="151.5" cy="321" r="279.9" fill="none" stroke="#5b6472" stroke-width="1.5" stroke-dasharray="6 5"/>
<line x1="151.5" y1="321" x2="505.8" y2="-38.5" stroke="#7c3aed" stroke-width="2.4" stroke-dasharray="8 5"/>
</g>
<text x="215.6" y="195.3" font-size="12" font-weight="700" text-anchor="end" fill="#7c3aed" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">direction from P motion: 44°</text>
<text x="215.6" y="210.3" font-size="11" text-anchor="end" fill="#7c3aed" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">(shaded: ± 15°)</text>
<text x="416.3" y="412.7" font-size="12" font-weight="700" text-anchor="end" fill="#5b6472" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">78 km from S − P</text>
<line x1="347.1" y1="120.7" x2="332.5" y2="155" stroke="#111827" stroke-width="1.4" stroke-dasharray="3 3"/>
<polygon points="332.5,143 335.5,151 344,151.3 337.3,156.6 339.6,164.8 332.5,160 325.5,164.8 327.8,156.6 321.1,151.3 329.6,151" fill="#f59e0b" stroke="#b45309" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="347.1,108.7 350.1,116.7 358.5,117 351.9,122.3 354.2,130.4 347.1,125.7 340.1,130.4 342.4,122.3 335.7,117 344.2,116.7" fill="#7c3aed" stroke="#3b0f80" stroke-width="1.2" stroke-linejoin="round"/>
<text x="346.5" y="173" font-size="12" font-weight="700" fill="#b45309" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">true epicenter</text>
<text x="333.1" y="112.7" font-size="12" font-weight="700" text-anchor="end" fill="#7c3aed" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">one-station estimate</text>
<text x="349.8" y="139.9" font-size="12" font-weight="700" fill="#111827" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">10 km off</text>
<polygon points="151.5,312 142.5,326.4 160.5,326.4" fill="#374151" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>
<text x="163.5" y="339" font-size="13" font-weight="700" fill="#111827" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">TMU</text>
<path d="M444 58L449.5 72L444 68.5L438.5 72Z" fill="#111827"/>
<text x="444" y="54" font-size="12" font-weight="700" text-anchor="middle" fill="#111827">N</text>
<path d="M28 406V412H100V406" fill="none" stroke="#111827" stroke-width="1.5"/>
<text x="106" y="413" font-size="12" fill="#111827">20 km</text>
<text x="492" y="62" font-size="12.5" font-weight="700" fill="#111827">1. Direction (P-wave motion)</text>
<text x="492" y="80" font-size="12.5" fill="#111827">44° (true: 47°)</text>
<text x="492" y="108" font-size="12.5" font-weight="700" fill="#111827">2. Distance (S − P)</text>
<text x="492" y="126" font-size="12.5" fill="#111827">S − P = 21.95 − 11.74 = 10.21 s</text>
<text x="492" y="144" font-size="12.5" fill="#111827">10.21 s × 7.66 km/s = 78.2 km</text>
<text x="492" y="162" font-size="12.5" fill="#111827">(true: 68 km)</text>
<text x="492" y="190" font-size="12.5" font-weight="700" fill="#111827">3. Go that far that way from TMU</text>
<text x="492" y="208" font-size="12.5" fill="#111827">Miss: 10 km from the true epicenter.</text>
<text x="492" y="236" font-size="11.5" fill="#5b6472">P: analyst pick. S: computer pick</text>
<text x="492" y="254" font-size="11.5" fill="#5b6472">(the analysts did not pick S at TMU).</text>
</svg>
