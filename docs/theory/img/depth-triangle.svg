<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" width="760" height="620" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<title>The hidden triangle</title>
<desc>S minus P gives the slanted distance d from the hypocenter to the station; the map needs the surface distance, sqrt(d^2 - z^2).</desc>
<rect x="0.5" y="0.5" width="759" height="619" rx="8" fill="#ffffff" stroke="#d9dde3"/>
<text x="12" y="22" font-size="15" font-weight="600" fill="#111827">The hidden triangle</text>
<rect x="12" y="90" width="736" height="154" fill="#f1ece2"/>
<line x1="12" y1="90" x2="748" y2="90" stroke="#a39478" stroke-width="1.5"/>
<line x1="200" y1="90" x2="200" y2="214" stroke="#5b6472" stroke-width="2" stroke-dasharray="7 5"/>
<line x1="200" y1="214" x2="580" y2="90" stroke="#111827" stroke-width="2.5" stroke-linecap="round"/>
<line x1="200" y1="90" x2="580" y2="90" stroke="#111827" stroke-width="4" stroke-linecap="round"/>
<path d="M216 90V106H200" fill="none" stroke="#111827" stroke-width="1.5"/>
<polygon points="200,78 202.9,86 211.4,86.3 204.8,91.5 207.1,99.7 200,95 192.9,99.7 195.2,91.5 188.6,86.3 197.1,86" fill="#f59e0b" stroke="#b45309" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="200,200 202.2,207.3 208.2,202.7 205.7,209.9 213.3,209.7 207,214 213.3,218.3 205.7,218.1 208.2,225.3 202.2,220.7 200,228 197.8,220.7 191.8,225.3 194.3,218.1 186.7,218.3 193,214 186.7,209.7 194.3,209.9 191.8,202.7 197.8,207.3" fill="#f59e0b" stroke="#b45309" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="580,72.4 569,90 591,90" fill="#374151" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>
<text x="200" y="70" font-size="14" font-weight="600" text-anchor="middle" fill="#111827">epicenter</text>
<text x="580" y="64" font-size="14" font-weight="600" text-anchor="middle" fill="#111827">station</text>
<text x="178" y="219" font-size="14" font-weight="600" text-anchor="end" fill="#111827" stroke="#f1ece2" stroke-width="4" stroke-linejoin="round" paint-order="stroke">hypocenter</text>
<text x="186" y="157" font-size="14" font-weight="600" text-anchor="end" fill="#5b6472" stroke="#f1ece2" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan font-style="italic">z</tspan>: depth</text>
<text x="415.7" y="134.1" font-size="14" font-weight="600" text-anchor="middle" fill="#111827" stroke="#f1ece2" stroke-width="4" stroke-linejoin="round" paint-order="stroke" transform="rotate(-18.1 415.7 134.1)"><tspan font-style="italic">d</tspan>: from S − P</text>
<text x="402" y="79" font-size="14" font-weight="600" text-anchor="middle" fill="#111827" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan font-style="italic">d</tspan><tspan dy="5" font-size="12">surface</tspan><tspan dy="-5">: on the map</tspan></text>
<text x="738" y="234" font-size="12" font-style="italic" text-anchor="end" fill="#5b6472">sketch, not to scale</text>
<text x="390" y="276" font-size="18" font-weight="600" text-anchor="middle" fill="#111827"><tspan font-style="italic">d</tspan><tspan dy="5" font-size="13">surface</tspan><tspan dy="-5"> = √(<tspan font-style="italic">d</tspan>² − <tspan font-style="italic">z</tspan>²)</tspan></text>
<line x1="12" y1="298" x2="748" y2="298" stroke="#e8ebef" stroke-width="1"/>
<text x="20" y="324" font-size="13" font-weight="600" fill="#111827">Near station: <tspan font-style="italic">d</tspan> = 10 km, <tspan font-style="italic">z</tspan> = 8 km → <tspan font-weight="700">6 km on the map</tspan></text>
<rect x="12" y="354" width="736" height="76" fill="#f1ece2"/>
<line x1="12" y1="354" x2="748" y2="354" stroke="#a39478" stroke-width="1.5"/>
<line x1="92" y1="354" x2="92" y2="418" stroke="#5b6472" stroke-width="1.8" stroke-dasharray="5 4"/>
<line x1="92" y1="418" x2="140" y2="354" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
<line x1="92" y1="354" x2="140" y2="354" stroke="#111827" stroke-width="3.5" stroke-linecap="round"/>
<path d="M99 354V361H92" fill="none" stroke="#111827" stroke-width="1.2"/>
<polygon points="92,346 94,351.2 99.6,351.5 95.2,355.1 96.7,360.5 92,357.4 87.3,360.5 88.8,355.1 84.4,351.5 90,351.2" fill="#f59e0b" stroke="#b45309" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="92,409 93.4,413.7 97.3,410.7 95.6,415.4 100.6,415.2 96.5,418 100.6,420.8 95.6,420.6 97.3,425.3 93.4,422.3 92,427 90.6,422.3 86.7,425.3 88.4,420.6 83.4,420.8 87.5,418 83.4,415.2 88.4,415.4 86.7,410.7 90.6,413.7" fill="#f59e0b" stroke="#b45309" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="140,342.8 133,354 147,354" fill="#374151" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>
<text x="80" y="390" font-size="12" font-weight="600" text-anchor="end" fill="#5b6472" stroke="#f1ece2" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan font-style="italic">z</tspan> = 8 km</text>
<text x="116" y="347" font-size="12" font-weight="600" text-anchor="middle" fill="#111827" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">6 km</text>
<text x="130" y="398" font-size="12" font-weight="600" fill="#111827" stroke="#f1ece2" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan font-style="italic">d</tspan> = 10 km</text>
<text x="20" y="460" font-size="13" font-weight="600" fill="#111827">Far station: <tspan font-style="italic">d</tspan> = 80 km, <tspan font-style="italic">z</tspan> = 8 km → <tspan font-weight="700">79.6 km on the map</tspan></text>
<rect x="12" y="490" width="736" height="76" fill="#f1ece2"/>
<line x1="12" y1="490" x2="748" y2="490" stroke="#a39478" stroke-width="1.5"/>
<line x1="92" y1="490" x2="92" y2="554" stroke="#5b6472" stroke-width="1.8" stroke-dasharray="5 4"/>
<line x1="92" y1="554" x2="728.8" y2="490" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
<line x1="92" y1="490" x2="728.8" y2="490" stroke="#111827" stroke-width="3.5" stroke-linecap="round"/>
<path d="M99 490V497H92" fill="none" stroke="#111827" stroke-width="1.2"/>
<polygon points="92,482 94,487.2 99.6,487.5 95.2,491.1 96.7,496.5 92,493.4 87.3,496.5 88.8,491.1 84.4,487.5 90,487.2" fill="#f59e0b" stroke="#b45309" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="92,545 93.4,549.7 97.3,546.7 95.6,551.4 100.6,551.2 96.5,554 100.6,556.8 95.6,556.6 97.3,561.3 93.4,558.3 92,563 90.6,558.3 86.7,561.3 88.4,556.6 83.4,556.8 87.5,554 83.4,551.2 88.4,551.4 86.7,546.7 90.6,549.7" fill="#f59e0b" stroke="#b45309" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="728.8,478.8 721.8,490 735.8,490" fill="#374151" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>
<text x="80" y="526" font-size="12" font-weight="600" text-anchor="end" fill="#5b6472" stroke="#f1ece2" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan font-style="italic">z</tspan> = 8 km</text>
<text x="410.4" y="483" font-size="12" font-weight="600" text-anchor="middle" fill="#111827" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">79.6 km on the map</text>
<text x="411.9" y="536.9" font-size="12" font-weight="600" text-anchor="middle" fill="#111827" stroke="#f1ece2" stroke-width="4" stroke-linejoin="round" paint-order="stroke" transform="rotate(-5.7 411.9 536.9)"><tspan font-style="italic">d</tspan> = 80 km</text>
<path d="M92 587V592H252V587M172 592V588" fill="none" stroke="#111827" stroke-width="1.5"/>
<text x="92" y="607" font-size="12" text-anchor="middle" fill="#5b6472">0</text>
<text x="172" y="607" font-size="12" text-anchor="middle" fill="#5b6472">10</text>
<text x="252" y="607" font-size="12" text-anchor="middle" fill="#5b6472">20 km</text>
<text x="286" y="593" font-size="12" fill="#5b6472">Both rows are drawn to this one scale.</text>
</svg>
