<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 654" width="760" height="654" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<title>Far away: travel times through the whole Earth</title>
<desc>Travel-time curves for P and S waves through the whole Earth (iasp91 model, quake 38 km deep): distance from 0 to 180 degrees runs down the page and minutes after the quake across. Both curves bend: they get steeper with distance, because the waves that reach far stations dive deeper into faster rock. A gray dashed straight line shows a wave that kept a steady 8 km/s. Direct P stops at about 98 degrees; a weak wave bent around the core (Pdiff) continues, and the band from 103 to 142 degrees is the P shadow zone. Waves through the core (PKP) arrive beyond it. Direct S stops near 100 degrees. A line at 35.8 degrees marks station SGU for the 2025 Sand Point, Alaska M7.3 quake: P predicted at 6:56 and picked at 6:59; S predicted at 12:32 and picked at about 12:45. An inset shows the Earth to scale with P ray paths curving through the mantle, one to SGU reaching 862 km deep, and one through the core.</desc>
