<text x="228" y="194" font-size="13" font-weight="700" text-anchor="middle" fill="#111827">east (E)</text>
<text x="20" y="270" font-size="12" fill="#111827">Three sensors at right angles.</text>
<text x="20" y="286" font-size="12" fill="#111827">Each feels only the motion along its arrow.</text>
