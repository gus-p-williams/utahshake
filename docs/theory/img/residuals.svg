<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 593" width="760" height="593" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<title>Residuals: how far each circle misses</title>
<desc>A trial epicenter (green pin) 8 km from the best fit. Each station's distance circle misses it; the residuals are MTPU −7.2 km, TCRU +6.8 km, WCU +3.3 km, and their RMS is 6.0 km.</desc>
<defs><clipPath id="res-map"><rect x="12" y="44" width="440" height="440" rx="4"/></clipPath></defs>
<rect x="0.5" y="0.5" width="759" height="592" rx="8" fill="#ffffff" stroke="#d9dde3"/>
<text x="12" y="22" font-size="15" font-weight="600" fill="#111827">Residuals: how far each circle misses</text>
<g clip-path="url(#res-map)">
<rect x="12" y="44" width="440" height="440" fill="#f3efe4"/>
<line x1="232" y1="222.8" x2="396.3" y2="484" stroke="#0d9488" stroke-width="1.3" stroke-dasharray="5 4"/>
<line x1="232" y1="222.8" x2="216.5" y2="44" stroke="#6b7a00" stroke-width="1.3" stroke-dasharray="5 4"/>
<line x1="232" y1="222.8" x2="304.2" y2="44" stroke="#7c3aed" stroke-width="1.3" stroke-dasharray="5 4"/>
<circle cx="510.7" cy="665.9" r="421.7" fill="none" stroke="#0d9488" stroke-width="2.2"/>
<circle cx="195.1" cy="-202.6" r="522.3" fill="none" stroke="#6b7a00" stroke-width="2.2"/>
<circle cx="623" cy="-745.6" r="1089.3" fill="none" stroke="#7c3aed" stroke-width="2.2"/>
<line x1="232" y1="222.8" x2="286.2" y2="308.9" stroke="#0d9488" stroke-width="4.5" stroke-linecap="round"/>
<line x1="232" y1="222.8" x2="240.2" y2="317.7" stroke="#6b7a00" stroke-width="4.5" stroke-linecap="round"/>
<line x1="232" y1="222.8" x2="215.2" y2="264.4" stroke="#7c3aed" stroke-width="4.5" stroke-linecap="round"/>
<circle cx="286.2" cy="308.9" r="3.6" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
<circle cx="240.2" cy="317.7" r="3.6" fill="#ffffff" stroke="#6b7a00" stroke-width="2"/>
<circle cx="215.2" cy="264.4" r="3.6" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
<polygon points="309.8,292.3 311.8,297.7 317.6,298 313.1,301.6 314.6,307.2 309.8,304 304.9,307.2 306.5,301.6 301.9,298 307.8,297.7" fill="#7c3aed" stroke="#3b0f80" stroke-width="1.2" stroke-linejoin="round"/>
<text x="320.8" y="294.5" font-size="12" font-weight="700" fill="#7c3aed" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">best fit</text>
<polygon points="394.7,481.5 383.8,475.3 393.9,469" fill="#0d9488" stroke="#ffffff" stroke-width="1" stroke-linejoin="round"/>
<polygon points="216.8,47 223.7,57.4 211.7,58.5" fill="#6b7a00" stroke="#ffffff" stroke-width="1" stroke-linejoin="round"/>
<polygon points="303.1,46.8 304.5,59.2 293.4,54.7" fill="#7c3aed" stroke="#ffffff" stroke-width="1" stroke-linejoin="round"/>
<path d="M30 68L35.5 82L30 78.5L24.5 82Z" fill="#111827" stroke="#ffffff" stroke-width="2" paint-order="stroke"/>
<text x="30" y="64" font-size="12" font-weight="700" text-anchor="middle" fill="#111827" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">N</text>
<path d="M24 465V470H161.5V465" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
<path d="M24 465V470H161.5V465" fill="none" stroke="#111827" stroke-width="1.5"/>
<text x="167.5" y="471" font-size="12" fill="#111827" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">10 km</text>
</g>
<rect x="12" y="44" width="440" height="440" rx="4" fill="none" stroke="#d9dde3"/>
<text x="380.3" y="472" font-size="12" font-weight="700" text-anchor="end" fill="#0d9488" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">to MTPU</text>
<text x="224.5" y="62" font-size="12" font-weight="700" fill="#6b7a00" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">to TCRU</text>
<text x="312.2" y="62" font-size="12" font-weight="700" fill="#7c3aed" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">to WCU</text>
<text x="306.2" y="330.9" font-size="13" font-weight="700" fill="#0d9488" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan font-style="italic">r</tspan>₁ = −7.2 km</text>
<text x="232.2" y="337.7" font-size="13" font-weight="700" text-anchor="end" fill="#6b7a00" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan font-style="italic">r</tspan>₂ = +6.8 km</text>
<text x="205.2" y="266.4" font-size="13" font-weight="700" text-anchor="end" fill="#7c3aed" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan font-style="italic">r</tspan>₃ = +3.3 km</text>
<g transform="translate(220.3 193.1) scale(0.9)"><path d="M13 1C6.6 1 1.5 6 1.5 12.3 1.5 20.6 13 33 13 33s11.5-12.4 11.5-20.7C24.5 6 19.4 1 13 1z" fill="#16a34a" stroke="#111111" stroke-width="1.2"/><circle cx="13" cy="12.5" r="4.2" fill="#fff" stroke="#111111" stroke-width="1"/></g>
<text x="247" y="204.8" font-size="12" font-weight="700" fill="#111827" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">your guess</text>
<text x="472" y="56" font-size="13" font-weight="600" fill="#111827">residual =</text>
<text x="544" y="56" font-size="13" font-weight="600" fill="#111827">distance from S − P</text>
<text x="544" y="73" font-size="13" font-weight="600" fill="#111827">minus distance from the pin</text>
<text x="472" y="106" font-size="12" fill="#5b6472">station</text>
<text x="582" y="92" font-size="12" text-anchor="end" fill="#5b6472">from</text>
<text x="582" y="106" font-size="12" text-anchor="end" fill="#5b6472">S − P</text>
<text x="642" y="92" font-size="12" text-anchor="end" fill="#5b6472">from</text>
<text x="642" y="106" font-size="12" text-anchor="end" fill="#5b6472">the pin</text>
<text x="656" y="106" font-size="12" fill="#5b6472">residual</text>
<line x1="472" y1="113" x2="746" y2="113" stroke="#d9dde3" stroke-width="1"/>
<polygon points="478,121.5 472,131.1 484,131.1" fill="#0d9488" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>
<text x="487" y="132" font-size="12" font-weight="700" fill="#0d9488">MTPU</text>
<text x="582" y="132" font-size="13" text-anchor="end" fill="#111827">31.7 km</text>
<text x="642" y="132" font-size="13" text-anchor="end" fill="#111827">38.9 km</text>
<text x="656" y="132" font-size="13" font-weight="700" fill="#111827"><tspan font-style="italic">r</tspan>₁ = −7.2 km</text>
<polygon points="478,145.5 472,155.1 484,155.1" fill="#6b7a00" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>
<text x="487" y="156" font-size="12" font-weight="700" fill="#6b7a00">TCRU</text>
<text x="582" y="156" font-size="13" text-anchor="end" fill="#111827">38.8 km</text>
<text x="642" y="156" font-size="13" text-anchor="end" fill="#111827">32.1 km</text>
<text x="656" y="156" font-size="13" font-weight="700" fill="#111827"><tspan font-style="italic">r</tspan>₂ = +6.8 km</text>
<polygon points="478,169.5 472,179.1 484,179.1" fill="#7c3aed" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>
<text x="487" y="180" font-size="12" font-weight="700" fill="#7c3aed">WCU</text>
<text x="582" y="180" font-size="13" text-anchor="end" fill="#111827">79.6 km</text>
<text x="642" y="180" font-size="13" text-anchor="end" fill="#111827">76.3 km</text>
<text x="656" y="180" font-size="13" font-weight="700" fill="#111827"><tspan font-style="italic">r</tspan>₃ = +3.3 km</text>
<text x="472" y="214" font-size="12" font-weight="600" fill="#111827">−  the pin is outside the circle</text>
<text x="487" y="230" font-size="12" fill="#5b6472">(too far from the station)</text>
<text x="472" y="254" font-size="12" font-weight="600" fill="#111827">+  the pin is inside the circle</text>
<text x="487" y="270" font-size="12" fill="#5b6472">(too close to the station)</text>
<text x="472" y="302" font-size="12" fill="#5b6472">The table, like Quake Locator, measures to</text>
<text x="472" y="318" font-size="12" fill="#5b6472">the quake at 8 km depth. The circles show</text>
<text x="472" y="334" font-size="12" fill="#5b6472">distance along the ground, so a gap on the</text>
<text x="472" y="350" font-size="12" fill="#5b6472">map differs from its residual by up to 0.2 km.</text>
<text x="14" y="518" font-size="15" font-weight="600" fill="#111827">RMS = √((<tspan font-style="italic">r</tspan>₁² + <tspan font-style="italic">r</tspan>₂² + <tspan font-style="italic">r</tspan>₃²) / 3) = √(((−7.2)² + 6.8² + 3.3²) / 3) = √(109.0 / 3) = <tspan font-weight="700">6.0 km</tspan></text>
<text x="14" y="540" font-size="12" fill="#111827">Quake Locator shows this as “Your circles miss it by 6.0 km on average.” At the best fit (purple star) the RMS is 0.3 km.</text>
<text x="14" y="562" font-size="12" fill="#5b6472">Real data: M3.3 quake near Junction, Utah, uu80162166; University of Utah analyst picks (network UU).</text>
<text x="14" y="579" font-size="12" fill="#5b6472">Circle radius: map distance from S − P, with P 5.8 km/s, S 3.3 km/s, depth 8 km (Quake Locator defaults).</text>
</svg>
