<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>How P and S Waves Move Rock</title>
  <meta name="description" content="Cartoon animation: a P wave and an S wave cross a block of rock. P moves the rock back and forth along the travel direction, S moves it up and down across it. The wave travels on; the rock does not.">
  <link rel="stylesheet" href="../css/app.css">
  <style>
    .wm { max-width: 980px; }
    .wm-controls { display: flex; flex-wrap: wrap; gap: .4rem .6rem; align-items: center; }
    .wm-controls .spacer { flex: 1; }
    #play { min-width: 6.2rem; }
    #scrub { width: 100%; margin: .1rem 0; accent-color: var(--accent); }
    .wm-box { position: relative; height: 340px; border: 1px solid var(--border); border-radius: 8px;
      overflow: hidden; background: var(--trace-bg); }
    .wm-box canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    @media (max-width: 560px) { .wm-box { height: 290px; } }
    #log { min-height: 1.4em; margin: 0; font-size: .92rem; }
    .wm .hint { margin: 0; }

    /* Embedded in a docs page: no header, fill the frame. */
    body.embed { height: 100vh; }
    body.embed .topbar, body.embed .standalone-only { display: none; }
    body.embed main.wm { height: 100vh; max-width: none; padding: 6px 8px; gap: 4px; }
    body.embed .wm-box { height: auto; flex: 1 1 0; min-height: 180px; }
    body.embed #log { font-size: .88rem; line-height: 1.3; }
    body:not(.embed) .embed-only { display: none; }
  </style>
  <script type="module" src="../js/wave-motion/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <a href="../" class="home" title="All UHSN apps">UHSN Apps</a>
      <h1>How P and S waves move rock</h1>
    </div>
    <div class="topbar-right">
      <a href="../../theory/waves/">Seismic waves</a>
      <a href="../../apps/">All apps</a>
    </div>
  </header>

  <main class="wm">
    <p class="hint standalone-only">A cartoon: the rock's motion is exaggerated.</p>
    <div class="wm-controls">
      <button id="play" type="button" class="primary">▶ Play</button>
      <button id="restart" type="button">↺ Restart</button>
      <span class="spacer"></span>
      <a class="embed-only" href="./" target="_blank" rel="noopener">Open full screen</a>
    </div>
    <input id="scrub" type="range" min="0" max="22" step="0.05" value="5" aria-label="Time after the quake (seconds)">
    <div id="box" class="wm-box">
      <canvas id="strips" role="img" aria-label="Two blocks of rock drawn as grids of dots, labelled P wave and S wave, with a distance scale from 0 to 60 km. In the P block a pulse squeezes and stretches the dots along the travel direction; in the S block a pulse lifts the dots into a bump. The S pulse is slower and falls behind. One coloured dot in each block moves and returns to its rest spot."></canvas>
    </div>
    <p id="log" role="status"></p>
  </main>
</body>
</html>
